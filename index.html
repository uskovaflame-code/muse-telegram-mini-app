<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>MUSE — cycle & care</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#d8cec2;
      --paper:#f3eadf;
      --paper-2:#fffaf4;
      --ink:#11120f;
      --muted:#6d675f;
      --line:rgba(23,23,20,.16);
      --rose:#b86167;
      --rose-soft:#dfb8b5;
      --rose-2:#ead7d0;
      --olive:#59674f;
      --olive-soft:#c8d0b8;
      --sage:#b8c49f;
      --accent:#2e3329;
      --white:#fffdf8;
      --shadow:0 22px 54px rgba(32,24,18,.12);
      --shadow-soft:0 8px 24px rgba(32,24,18,.075);
      --radius-xl:32px;
      --radius-lg:24px;
      --radius-md:18px;
      --nav-h:82px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:linear-gradient(180deg,#cfc3b5 0%,#e0d6ca 100%);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh}
    button,input{font:inherit}
    .shell{position:relative;max-width:430px;min-height:100vh;margin:0 auto;background:linear-gradient(180deg,#f2e8dc 0%,#f8f1e8 52%,#eee3d7 100%);overflow:hidden;box-shadow:0 0 70px rgba(0,0,0,.12)}
    .glow{position:absolute;border-radius:50%;filter:blur(3px);opacity:.75;pointer-events:none}
    .glow.a{width:240px;height:240px;top:-60px;right:-90px;background:radial-gradient(circle,#edd8cf 0%,#cfd4af 58%,rgba(255,255,255,0) 72%)}
    .glow.b{width:220px;height:220px;left:-120px;top:320px;background:radial-gradient(circle,#ddb6b1 0%,rgba(255,255,255,0) 70%)}
    .app{position:relative;z-index:2;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 96px)}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
    .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .brand{font-family:Georgia,"Times New Roman",serif;font-size:40px;line-height:.95;letter-spacing:-.05em;margin-top:4px}
    .page-title{font-family:Georgia,"Times New Roman",serif;font-size:33px;line-height:1;letter-spacing:-.035em;margin:2px 0 0}
    .top-note{font-size:12px;color:var(--muted);margin-top:5px;letter-spacing:.01em}
    .avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.45);backdrop-filter:blur(14px);box-shadow:var(--shadow-soft);font-family:Georgia,serif;font-style:italic;font-size:18px}
    .art-badge{display:grid;place-items:center;width:40px;height:40px;border-radius:15px;background:rgba(255,253,249,.78);border:1px solid rgba(82,72,61,.12);box-shadow:var(--shadow-soft)}
    .art-badge svg{width:26px;height:26px}
    .art-badge.soft{background:rgba(255,255,255,.55)}
    .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .hero-art{margin-top:20px;width:112px;height:84px;border-radius:26px;background:rgba(255,253,249,.45);border:1px solid rgba(255,255,255,.65);display:grid;place-items:center;backdrop-filter:blur(8px)}
    .hero-art svg{width:92px;height:72px}
    .mood-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
    .mood-card{min-height:100px;border-radius:22px;padding:13px 12px;background:rgba(255,250,244,.96);border:1px solid rgba(82,72,61,.12);box-shadow:var(--shadow-soft);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}
    .mood-card::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-16px;bottom:-22px;background:rgba(255,255,255,.32)}
    .mood-card svg{width:36px;height:36px;position:relative;z-index:1}
    .mood-card b{font-size:12px;position:relative;z-index:1}
    .mood-card span{font-size:11px;color:var(--muted);position:relative;z-index:1}
    .mood-card.rose{background:linear-gradient(160deg,#eed8d6 0%,#fbf2ea 100%)}
    .mood-card.sage{background:linear-gradient(160deg,#dde5d0 0%,#f9f4eb 100%)}
    .mood-card.cream{background:linear-gradient(160deg,#f7eadb 0%,#fff8f1 100%)}
    .timeline-art{display:flex;align-items:center;gap:10px}
    .timeline-art .art-badge{width:38px;height:38px;border-radius:14px}

    .hero{position:relative;overflow:hidden;border-radius:34px;padding:24px 22px 22px;background:linear-gradient(160deg,#fff8f2 0%,#eadbd1 48%,#dfe3cf 100%);border:1px solid rgba(84,74,64,.12);box-shadow:var(--shadow)}
    .hero::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-90px;top:-90px;background:radial-gradient(circle,#f5ebe5 0%,rgba(255,255,255,0) 72%)}
    .hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;left:-70px;bottom:-80px;background:radial-gradient(circle,#dbe1ce 0%,rgba(255,255,255,0) 72%)}
    .hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.25fr .95fr;gap:12px;align-items:stretch}
    .hero-copy h1{font-family:Georgia,"Times New Roman",serif;font-size:54px;line-height:.9;letter-spacing:-.05em;margin:12px 0 10px;max-width:190px}
    .hero-copy p{margin:0;font-size:12.5px;line-height:1.5;color:#5d5953;max-width:210px}
    .hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);font-size:11px;color:#57534f;backdrop-filter:blur(10px)}
    .pill-dot{width:7px;height:7px;border-radius:50%}
    .hero-side{display:flex;flex-direction:column;gap:10px;justify-content:space-between}
    .mini-card{padding:15px;border-radius:22px;background:rgba(255,252,247,.86);backdrop-filter:blur(16px);border:1px solid rgba(83,74,64,.12);box-shadow:var(--shadow-soft);min-height:108px}
    .mini-card .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    .mini-card .value{font-family:Georgia,"Times New Roman",serif;font-size:42px;line-height:1;margin:14px 0 4px;letter-spacing:-.04em}
    .mini-card .small{font-size:12px;color:#68635d;line-height:1.4}
    .mini-card.dark{background:linear-gradient(160deg,#252820 0%,#3b4435 100%);color:#fff;border-color:rgba(255,255,255,.12)}
    .mini-card.dark .label,.mini-card.dark .small{color:rgba(255,255,255,.72)}

    .section{margin-top:20px}
    .section-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin:0 4px 10px}
    .section-head h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:29px;letter-spacing:-.04em;font-weight:400}
    .section-head p{margin:0;font-size:11px;color:var(--muted);text-align:right;max-width:138px;line-height:1.35}

    .calendar-card{border-radius:30px;padding:18px 15px 15px;background:rgba(255,250,244,.96);backdrop-filter:blur(18px);border:1px solid rgba(82,72,61,.12);box-shadow:var(--shadow)}
    .calendar-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
    .month-controls{display:flex;align-items:center;gap:8px}
    .month-nav{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:rgba(255,253,249,.9);display:grid;place-items:center;cursor:pointer;font-size:19px;line-height:1;box-shadow:var(--shadow-soft)}
    .month-nav:active{transform:scale(.97)}
    .month-wrap small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
    .month-wrap strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:31px;font-weight:400;line-height:1;letter-spacing:-.04em}
    .legend{display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:flex-end}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
    .legend-item i{width:8px;height:8px;border-radius:50%;display:inline-block}
    .weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .weekdays{margin-bottom:8px}
    .weekdays div{text-align:center;font-size:10px;color:#99938b;text-transform:uppercase}
    .day{position:relative;min-height:58px;border:0;background:transparent;border-radius:18px;padding:8px 4px 18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer;transition:.2s ease}
    .day:hover{background:rgba(217,200,187,.45)}
    .day.outside{opacity:.22;cursor:default}
    .day-num{font-size:13px;line-height:1.2}
    .day.today{background:linear-gradient(180deg,#22261f 0%,#384132 100%);color:#fff;box-shadow:0 16px 24px rgba(46,47,40,.18)}
    .day.selected:not(.today){outline:1px solid rgba(89,103,79,.45);background:#e8ddcf}
    .day.course{box-shadow:inset 0 0 0 1px rgba(201,141,141,.22)}
    .marks{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:32px}
    .mark{width:6px;height:6px;border-radius:50%}
    .mark.period{background:var(--rose)}
    .mark.estro{background:var(--olive)}
    .mark.utro{background:#67518f}
    .mark.rsleek{background:#b98949}
    .mark.lymph{background:#597f8c}
    .day.today .mark{box-shadow:0 0 0 1px rgba(255,255,255,.55)}
    .day-detail{margin-top:14px;padding:14px;border-radius:22px;background:#f4e9df;border:1px solid var(--line)}
    .day-detail h3{margin:0 0 8px;font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:400;letter-spacing:-.03em}
    .detail-list{display:grid;gap:7px}
    .detail-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:16px;background:#fffaf5;border:1px solid rgba(23,23,20,.06)}
    .detail-item b{font-size:13px}
    .detail-item span{font-size:12px;color:var(--muted)}
    .empty{font-size:12px;color:var(--muted)}

    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .info-card{border-radius:24px;padding:15px;background:rgba(255,250,244,.96);border:1px solid rgba(82,72,61,.12);box-shadow:var(--shadow-soft)}
    .info-card.accent{background:linear-gradient(160deg,#e8c8c5 0%,#f3e8df 100%)}
    .info-card.sage{background:linear-gradient(160deg,#d2ddc3 0%,#f0eee3 100%)}
    .info-card .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    .info-card .v{font-family:Georgia,"Times New Roman",serif;font-size:33px;line-height:1;margin:12px 0 6px;letter-spacing:-.04em}
    .info-card .t{font-size:12px;color:#6a655f;line-height:1.45}

    .timeline{display:grid;gap:10px}
    .timeline-item{display:flex;justify-content:space-between;gap:12px;padding:13px 14px;border-radius:17px;background:rgba(255,253,249,.76);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow-soft)}
    .timeline-item strong{display:block;font-size:14px}
    .timeline-item span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
    .timeline-item time{font-size:12px;color:var(--muted);white-space:nowrap}

    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat-card{padding:18px;border-radius:24px;background:rgba(255,253,249,.84);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow-soft)}
    .stat-card h3{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
    .stat-card strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:400;line-height:1;letter-spacing:-.04em;margin:14px 0 8px}
    .stat-card p{margin:0;font-size:12px;color:#69645e;line-height:1.4}
    .progress-list{display:grid;gap:10px}
    .progress-item{padding:14px 15px;border-radius:20px;background:rgba(255,253,249,.8);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow-soft)}
    .progress-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:8px}
    .bar{height:8px;border-radius:999px;background:#ede7df;overflow:hidden}
    .bar > i{display:block;height:100%;border-radius:999px}
    .bar.rose > i{background:var(--rose)}
    .bar.olive > i{background:var(--olive)}
    .bar.gold > i{background:#d8b57d}
    .bar.blue > i{background:#93aab2}
    .list-card{padding:16px;border-radius:24px;background:rgba(255,253,249,.84);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow-soft)}
    .list-card h3{margin:0 0 10px;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:400;letter-spacing:-.04em}
    .simple-list{display:grid;gap:10px}
    .simple-row{display:flex;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:13px}
    .simple-row:last-child{border-bottom:0;padding-bottom:0}
    .simple-row span{color:var(--muted)}

    .profile-card{padding:18px;border-radius:28px;background:rgba(255,253,249,.84);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow)}
    .profile-name{font-family:Georgia,"Times New Roman",serif;font-size:30px;letter-spacing:-.04em;margin:12px 0 6px}
    .profile-text{font-size:13px;color:#66615b;line-height:1.5}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .chip{padding:9px 12px;border-radius:999px;background:#fffdf9;border:1px solid var(--line);font-size:12px;color:#5b5751}

    .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);width:min(398px,calc(100% - 28px));z-index:30;border:0;border-radius:999px;padding:15px 18px;background:linear-gradient(180deg,#1b1d19 0%,#30352b 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;box-shadow:0 20px 36px rgba(0,0,0,.18);cursor:pointer}
    .fab strong{font-size:15px}
    .fab span{font-size:12px;color:rgba(255,255,255,.7)}
    .fab b{font-size:22px;font-weight:400}

    .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);z-index:25;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:rgba(244,234,222,.96);backdrop-filter:blur(22px);border-top:1px solid rgba(23,23,20,.06)}
    .nav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .nav-btn{border:0;background:transparent;border-radius:18px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#857f79;cursor:pointer}
    .nav-btn i{font-style:normal;font-size:18px;line-height:1}
    .nav-btn span{font-size:11px}
    .nav-btn.active{background:#fffaf4;color:#1a1d18;box-shadow:var(--shadow-soft)}

    .sheet-backdrop{position:fixed;inset:0;z-index:60;background:rgba(18,17,15,.36);display:none;align-items:flex-end;justify-content:center}
    .sheet-backdrop.open{display:flex}
    .sheet{width:min(430px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#f6ecdf 0%,#efe1d2 100%);border-radius:32px 32px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 22px);box-shadow:0 -18px 44px rgba(0,0,0,.16)}
    .handle{width:44px;height:4px;border-radius:999px;background:#d4cec4;margin:2px auto 18px}
    .sheet h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:400;letter-spacing:-.04em}
    .sheet-sub{margin:4px 0 18px;font-size:12px;color:var(--muted)}
    .action-grid{display:grid;gap:10px}
    .action-card{border:0;text-align:left;padding:16px;border-radius:22px;background:rgba(255,250,244,.98);border:1px solid rgba(82,72,61,.12);box-shadow:var(--shadow-soft);display:flex;justify-content:space-between;gap:12px;cursor:pointer}
    .action-card strong{display:block;font-size:14px}
    .action-card span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
    .action-card b{font-size:22px;font-weight:400;align-self:center}
    .sheet-panel{display:none}
    .sheet-panel.open{display:block}
    .stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0}
    .stepper button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fffdf9;font-size:24px;cursor:pointer}
    .stepper strong{font-family:Georgia,"Times New Roman",serif;font-size:46px;font-weight:400;letter-spacing:-.04em}
    .sheet-actions{display:grid;gap:10px}
    .btn-primary,.btn-secondary{border:0;border-radius:18px;padding:15px 16px;cursor:pointer}
    .btn-primary{background:linear-gradient(180deg,#20241e 0%,#394332 100%);color:#fff;font-weight:600}
    .btn-secondary{background:#fffdf9;color:#635e58;border:1px solid var(--line)}
    .toggle-row{display:grid;gap:10px}
    .toggle-option{display:flex;justify-content:space-between;gap:12px;padding:14px;border-radius:18px;background:#fffdf9;border:1px solid var(--line)}

    .error-state{min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px;color:var(--muted)}
    .hidden{display:none !important}
    @media (max-width:380px){
      .hero-grid,.two-col,.stats-grid,.mood-strip{grid-template-columns:1fr}
      .legend{justify-content:flex-start}
      .hero-copy h1{max-width:none}
      .hero-copy p{max-width:none}
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="glow a"></div>
    <div class="glow b"></div>
    <main class="app" id="app"><div class="error-state">Загружаю приложение…</div></main>
  </div>

  <button class="fab hidden" id="openSheetBtn">
    <div>
      <strong>Отметить сегодня</strong>
      <span>быстро добавить действие</span>
    </div>
    <b>＋</b>
  </button>

  <nav class="bottom-nav hidden" id="bottomNav">
    <div class="nav-grid">
      <button class="nav-btn active" data-tab="today"><i>◔</i><span>Сегодня</span></button>
      <button class="nav-btn" data-tab="calendar"><i>▦</i><span>Календарь</span></button>
      <button class="nav-btn" data-tab="stats"><i>◫</i><span>Статистика</span></button>
      <button class="nav-btn" data-tab="profile"><i>◎</i><span>Профиль</span></button>
    </div>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet">
      <div class="handle"></div>
      <div id="sheetHome">
        <h2>Отметить сегодня</h2>
        <div class="sheet-sub" id="sheetDateText"></div>
        <div class="action-grid">
          <button class="action-card" data-panel="estro">
            <div><strong>Эстрожель</strong><span>указать количество нажатий</span></div><b>+</b>
          </button>
          <button class="action-card" data-panel="newBottle">
            <div><strong>Новая бутылка</strong><span>обнулить счётчик и начать заново</span></div><b>↺</b>
          </button>
          <button class="action-card" data-panel="utro">
            <div><strong>Утрожестан</strong><span>подтвердить приём за сегодня</span></div><b>✓</b>
          </button>
          <button class="action-card" data-panel="rsleek">
            <div><strong>R-Sleek</strong><span>отметить процедуру</span></div><b>+</b>
          </button>
          <button class="action-card" data-panel="lymph">
            <div><strong>Лимфодренажный</strong><span>отметить массаж</span></div><b>+</b>
          </button>
          <button class="action-card" data-panel="period">
            <div><strong>Месячные</strong><span>отметить день цикла</span></div><b>+</b>
          </button>
        </div>
      </div>
      <div id="sheetPanel" class="sheet-panel"></div>
    </div>
  </div>

<script>
const fallbackData = {
  "app": {
    "name": "MUSE",
    "subtitle": "cycle & care"
  },
  "displayMonth": "2026-10",
  "today": "2026-10-06",
  "profile": {
    "name": "Пользователь",
    "theme": "Editorial feminine",
    "sharedMode": "личный дневник"
  },
  "cycle": {
    "currentDay": "—",
    "avgLength": null,
    "previousCycles": [],
    "periodDays": [],
    "nextPeriodEstimate": null
  },
  "estrogel": {
    "todayPresses": 0,
    "bottlePressCount": 0,
    "bottleStarted": null,
    "daily": {},
    "bottleHistory": []
  },
  "utrogestan": {
    "startDay": null,
    "courseLengthDays": null,
    "dose": "",
    "takenDates": []
  },
  "massages": {
    "monthlyGoal": {
      "rsleek": 6,
      "lymph": 4
    },
    "rsleek": [],
    "lymph": []
  },
  "examples": []
};

let data = null;
let activeTab = 'today';
let selectedDate = null;

function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }
function safeDate(iso){ return new Date(iso + 'T12:00:00'); }
function formatLongDate(iso){ return safeDate(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}); }
function formatShortDate(iso){ if(!iso) return '—'; return safeDate(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
function displayMonthParts(){ const [y,m]=data.displayMonth.split('-').map(Number); return {year:y,month:m}; }
function inDisplayMonth(iso){ return iso && iso.startsWith(data.displayMonth); }
function countInDisplayMonth(arr){ return arr.filter(inDisplayMonth).length; }
function uniquePush(arr,val){ if(!arr.includes(val)) arr.push(val); }
function sortedExamples(){
  return [...(data.examples||[])].sort((a,b)=> safeDate(b.date)-safeDate(a.date));
}
function syncExamples(type, value, date = data.today){
  data.examples = data.examples || [];
  data.examples = data.examples.filter(x => !(x.type===type && x.date===date));
  data.examples.unshift({date, type, value});
  data.examples = data.examples
    .sort((a,b)=> safeDate(b.date)-safeDate(a.date))
    .slice(0,10);
}
function storageKey(){
  const userId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
  return 'muse-journal-v1-' + (userId || 'browser');
}
function persistData(){
  try{ localStorage.setItem(storageKey(), JSON.stringify(data)); }catch(e){}
}
function targetDate(){ return selectedDate || data.today; }
function targetLabel(){ return targetDate() === data.today ? 'сегодня' : formatLongDate(targetDate()); }
function shiftMonth(delta){
  const {year,month} = displayMonthParts();
  const d = new Date(year, month - 1 + delta, 1);
  data.displayMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const todayMonth = data.today.slice(0,7);
  selectedDate = data.displayMonth === todayMonth ? data.today : `${data.displayMonth}-01`;
  persistData();
  render();
}
function recalcCycleFromPeriods(){
  const today = safeDate(data.today);
  const actual = [...(data.cycle.periodDays || [])]
    .filter(d => safeDate(d) <= today)
    .sort();
  if(!actual.length) return;
  const starts=[];
  for(let i=0;i<actual.length;i++){
    if(i===0){ starts.push(actual[i]); continue; }
    const prev = safeDate(actual[i-1]);
    const cur = safeDate(actual[i]);
    const diff = Math.round((cur-prev)/86400000);
    if(diff>1) starts.push(actual[i]);
  }
  const latestStart = starts[starts.length-1];
  const diff = Math.floor((today-safeDate(latestStart))/86400000);
  if(diff >= 0) data.cycle.currentDay = diff + 1;
  const avg = Number(cycleAvg()) || 28;
  const next = new Date(safeDate(latestStart));
  next.setDate(next.getDate()+avg);
  data.cycle.nextPeriodEstimate = `${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-${String(next.getDate()).padStart(2,'0')}`;
}
function nextPeriodCaption(){
  if(!data.cycle.nextPeriodEstimate) return 'Следующая дата цикла не указана';
  return 'Ориентировочно: ' + formatLongDate(data.cycle.nextPeriodEstimate);
}
function cycleAvg(){
  const arr = data.cycle.previousCycles || [];
  if(!arr.length) return data.cycle.avgLength || '—';
  return Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
}
function estroAvgMonth(){
  const values = Object.entries(data.estrogel.daily || {}).filter(([date])=> inDisplayMonth(date)).map(([,n])=> Number(n)||0);
  if(!values.length) return 0;
  return (values.reduce((a,b)=>a+b,0) / values.length).toFixed(1);
}
function utroMonthTaken(){ return countInDisplayMonth(data.utrogestan.takenDates || []); }
function utroCourseProgress(){
  if(!data.utrogestan.startDay || !data.utrogestan.courseLengthDays) return {done:utroMonthTaken(),total:0};
  const total = data.utrogestan.courseLengthDays || 14;
  const start = data.utrogestan.startDay || 11;
  const month = displayMonthParts().month;
  const year = displayMonthParts().year;
  let done = 0;
  for(let i=0;i<total;i++){
    const day = start + i;
    const iso = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    if((data.utrogestan.takenDates || []).includes(iso)) done++;
  }
  return {done,total};
}
function isUtroScheduled(iso){
  if(!data.utrogestan.startDay || !data.utrogestan.courseLengthDays) return false;
  const d = safeDate(iso);
  const monthMatch = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` === data.displayMonth;
  if(!monthMatch) return false;
  const day = d.getDate();
  const start = data.utrogestan.startDay || 11;
  const end = start + (data.utrogestan.courseLengthDays || 14) - 1;
  return day >= start && day <= end;
}
function hasPeriod(iso){ return (data.cycle.periodDays || []).includes(iso); }
function marksFor(iso){
  const result=[];
  if(hasPeriod(iso)) result.push({key:'period',label:'Месячные',value:'отмечен день цикла'});
  if(data.estrogel.daily && data.estrogel.daily[iso]) result.push({key:'estro',label:'Эстрожель',value:`${data.estrogel.daily[iso]} нажатия`});
  if((data.utrogestan.takenDates || []).includes(iso)) result.push({key:'utro',label:'Утрожестан',value:'приём подтверждён'});
  if((data.massages.rsleek || []).includes(iso)) result.push({key:'rsleek',label:'R-Sleek',value:'процедура'});
  if((data.massages.lymph || []).includes(iso)) result.push({key:'lymph',label:'Лимфодренажный',value:'массаж'});
  return result;
}

function calendarGridHTML(showOutside = true){
  const {year,month} = displayMonthParts();
  const first = new Date(year, month - 1, 1);
  const daysInMonth = new Date(year, month, 0).getDate();
  const firstDay = (first.getDay() + 6) % 7;
  const prevMonthDays = new Date(year, month - 1, 0).getDate();
  let cells = [];

  if(showOutside){
    for(let i=0;i<firstDay;i++){
      const dayNum = prevMonthDays - firstDay + i + 1;
      cells.push(`<div class="day outside"><span class="day-num">${dayNum}</span></div>`);
    }
  } else {
    for(let i=0;i<firstDay;i++) cells.push('<div class="day outside"></div>');
  }

  for(let day=1; day<=daysInMonth; day++){
    const iso = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const marks = marksFor(iso);
    const classes = ['day'];
    if(iso === data.today) classes.push('today');
    if(selectedDate === iso) classes.push('selected');
    if(isUtroScheduled(iso)) classes.push('course');
    cells.push(`
      <button class="${classes.join(' ')}" data-date="${iso}">
        <span class="day-num">${day}</span>
        <span class="marks">${marks.slice(0,4).map(mark => `<i class="mark ${mark.key}"></i>`).join('')}</span>
      </button>
    `);
  }

  while(cells.length % 7 !== 0){
    const extraDay = cells.length - (firstDay + daysInMonth) + 1;
    cells.push(showOutside ? `<div class="day outside"><span class="day-num">${extraDay}</span></div>` : '<div class="day outside"></div>');
  }

  return `
    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div class="days">${cells.join('')}</div>`;
}

  }
  return `
    <div class="day-detail" id="dayDetailBox">

}

        <span class="chip">Утрожестан: ${data.utrogestan.startDay ? 'с ' + data.utrogestan.startDay + ' числа' : 'график не задан'}</span>
        <span class="chip">${data.utrogestan.courseLengthDays ? data.utrogestan.courseLengthDays + ' дней курса' : 'длительность не задана'}</span>
        
      </div>
    </section>
    <section class="section">
      <div class="list-card">
        <h3>Настройки трекинга</h3>
        <div class="simple-list">
          <div class="simple-row"><b>Эстрожель</b><span>учёт нажатий с новой бутылки</span></div>
          <div class="simple-row"><b>Утрожестан</b><span>${data.utrogestan.dose || 'дозировка не указана'} · ежедневное подтверждение</span></div>
          <div class="simple-row"><b>Массажи</b><span>R-Sleek и лимфодренажный</span></div>
          <div class="simple-row"><b>Главное действие</b><span>«Отметить сегодня»</span></div>
        </div>
      </div>
    </section>`;
}

function render(){
  const app = document.getElementById('app');
  selectedDate = selectedDate || data.today;
  let html = '';
  if(activeTab === 'today') html = todayViewHTML();
  if(activeTab === 'calendar') html = calendarViewHTML();
  if(activeTab === 'stats') html = statsViewHTML();
  if(activeTab === 'profile') html = profileViewHTML();
  app.innerHTML = html;
  document.getElementById('openSheetBtn').classList.remove('hidden');
  document.getElementById('bottomNav').classList.remove('hidden');
  bindMainEvents();
}

function bindMainEvents(){
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === activeTab);
    btn.onclick = () => { activeTab = btn.dataset.tab; render(); };
  });

  document.querySelectorAll('.day[data-date]').forEach(btn => {
    btn.onclick = () => {
      selectedDate = btn.dataset.date;
      render();
    };
  });

  const prev = document.getElementById('prevMonth');
  const next = document.getElementById('nextMonth');
  if(prev) prev.onclick = () => shiftMonth(-1);
  if(next) next.onclick = () => shiftMonth(1);

  const fab = document.getElementById('openSheetBtn');
  fab.onclick = openSheet;
  const strong = fab.querySelector('strong');
  const small = fab.querySelector('span');
  if(targetDate() === data.today){
    strong.textContent = 'Отметить сегодня';
    small.textContent = 'быстро добавить действие';
  }else{
    strong.textContent = `Отметить ${formatLongDate(targetDate())}`;
    small.textContent = 'добавить запись на выбранную дату';
  }
}

function openSheet(){
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('sheetDateText').textContent = formatLongDate(targetDate());
  const h = document.querySelector('#sheetHome h2');
  if(h) h.textContent = targetDate() === data.today ? 'Отметить сегодня' : 'Отметить дату';
  showSheetHome();
}
function closeSheet(){ document.getElementById('sheetBackdrop').classList.remove('open'); }
function showSheetHome(){
  document.getElementById('sheetHome').style.display = 'block';
  const panel = document.getElementById('sheetPanel');
  panel.className = 'sheet-panel';
  panel.innerHTML = '';
}
function backButtonHTML(){ return '<button class="btn-secondary" id="backSheet">Назад</button>'; }
function actionDone(close = true){ render(); if(close) closeSheet(); }
function openPanel(type){
  document.getElementById('sheetHome').style.display = 'none';
  const panel = document.getElementById('sheetPanel');
  panel.className = 'sheet-panel open';

  if(type === 'estro'){
    const date = targetDate();
    let count = Number(data.estrogel.daily?.[date] || (date === data.today ? data.estrogel.todayPresses : 0));
    panel.innerHTML = `
      <h2>Эстрожель</h2>
      <div class="sheet-sub">Сколько нажатий было ${targetLabel()}?</div>
      <div class="stepper">
        <button id="minusBtn">−</button>
        <strong id="countValue">${count}</strong>
        <button id="plusBtn">+</button>
      </div>
      <div class="sheet-actions">
        <button class="btn-primary" id="saveEstro">Сохранить</button>
        ${backButtonHTML()}
      </div>`;
    panel.querySelector('#minusBtn').onclick = () => { count = Math.max(0, count - 1); panel.querySelector('#countValue').textContent = count; };
    panel.querySelector('#plusBtn').onclick = () => { count += 1; panel.querySelector('#countValue').textContent = count; };
    panel.querySelector('#saveEstro').onclick = () => {
      const prev = Number(data.estrogel.daily[date] || 0);
      if(date === data.today) data.estrogel.todayPresses = count;
      data.estrogel.daily[date] = count;
      if(date >= data.estrogel.bottleStarted && date <= data.today){
        data.estrogel.bottlePressCount = Math.max(0, data.estrogel.bottlePressCount - prev + count);
      }
      const currentBottle = (data.estrogel.bottleHistory || []).find(item => item.current);
      if(currentBottle) currentBottle.totalPresses = data.estrogel.bottlePressCount;
      syncExamples('Эстрожель', `${count} нажатия`, date);
      persistData();
      actionDone();
    };
  }

  if(type === 'newBottle'){
    panel.innerHTML = `
      <h2>Новая бутылка</h2>
      <div class="sheet-sub">Счётчик нажатий начнётся заново с выбранной даты.</div>
      <div class="toggle-row">
        <div class="toggle-option"><b>Текущая бутылка</b><span>${data.estrogel.bottlePressCount} нажатий</span></div>
        <div class="toggle-option"><b>Новая стартовая дата</b><span>${formatLongDate(targetDate())}</span></div>
      </div>
      <div class="sheet-actions" style="margin-top:18px">
        <button class="btn-primary" id="saveBottle">Начать новую бутылку</button>
        ${backButtonHTML()}
      </div>`;
    panel.querySelector('#saveBottle').onclick = () => {
      data.estrogel.bottleHistory = data.estrogel.bottleHistory || [];
      data.estrogel.bottleHistory.forEach(item => item.current = false);
      const date = targetDate();
      data.estrogel.bottleStarted = date;
      const startPresses = Number(data.estrogel.daily?.[date] || (date===data.today ? data.estrogel.todayPresses : 0));
      data.estrogel.bottlePressCount = date === data.today ? startPresses : data.estrogel.bottlePressCount;
      data.estrogel.bottleHistory.unshift({started:date,totalPresses:data.estrogel.bottlePressCount,current:true});
      syncExamples('Новая бутылка', 'счётчик начат заново', date);
      persistData();
      actionDone();
    };
  }

  if(['utro','rsleek','lymph','period'].includes(type)){
    const date = targetDate();
    const map = {
      utro:{title:'Утрожестан', sub:`Подтвердить приём за ${targetLabel()}?`, typeLabel:'Утрожестан', value:'приём подтверждён', apply:() => uniquePush(data.utrogestan.takenDates, date)},
      rsleek:{title:'R-Sleek', sub:`Добавить процедуру за ${targetLabel()}?`, typeLabel:'R-Sleek', value:'процедура', apply:() => uniquePush(data.massages.rsleek, date)},
      lymph:{title:'Лимфодренажный', sub:`Добавить массаж за ${targetLabel()}?`, typeLabel:'Лимфодренажный массаж', value:'процедура', apply:() => uniquePush(data.massages.lymph, date)},
      period:{title:'Месячные', sub:`Отметить месячные за ${targetLabel()}?`, typeLabel:'Месячные', value:'отмечен день цикла', apply:() => uniquePush(data.cycle.periodDays, date)}
    };
    const item = map[type];
    panel.innerHTML = `
      <h2>${item.title}</h2>
      <div class="sheet-sub">${item.sub}</div>
      <div class="sheet-actions">
        <button class="btn-primary" id="confirmAction">Да, отметить</button>
        ${backButtonHTML()}
      </div>`;
    panel.querySelector('#confirmAction').onclick = () => {
      item.apply();
      if(type === 'period') recalcCycleFromPeriods();
      syncExamples(item.typeLabel, item.value, date);
      persistData();
      actionDone();
    };
  }

  const backBtn = panel.querySelector('#backSheet');
  if(backBtn) backBtn.onclick = showSheetHome;
}

function bindSheetEvents(){
  document.querySelectorAll('.action-card').forEach(btn => btn.onclick = () => openPanel(btn.dataset.panel));
  const backdrop = document.getElementById('sheetBackdrop');
  backdrop.addEventListener('click', (e) => { if(e.target.id === 'sheetBackdrop') closeSheet(); });
}

function deepMerge(base, saved){
  if(Array.isArray(base) || Array.isArray(saved)) return saved !== undefined ? saved : base;
  if(base && typeof base === 'object' && saved && typeof saved === 'object'){
    const out = {...base};
    Object.keys(saved).forEach(k => { out[k] = k in base ? deepMerge(base[k], saved[k]) : saved[k]; });
    return out;
  }
  return saved !== undefined ? saved : base;
}

async function loadData(){
  try{
    if(window.Telegram?.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
    const response = await fetch('data.json?v=' + Date.now(), {cache:'no-store'});
    if(!response.ok) throw new Error('bad fetch');
    data = await response.json();
  } catch(err){
    data = deepClone(fallbackData);
  }
  if(!data || typeof data !== 'object') data = deepClone(fallbackData);
  try{
    const saved = JSON.parse(localStorage.getItem(storageKey()) || localStorage.getItem('museDataV2') || 'null');
    if(saved) data = deepMerge(data, saved);
  }catch(e){}
  const now = new Date();
  data.today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  data.displayMonth = data.today.slice(0,7);
  data.estrogel.todayPresses = Number(data.estrogel.daily?.[data.today] || 0);
  recalcCycleFromPeriods();
  if(!selectedDate) selectedDate = data.today;
  bindSheetEvents();
  render();
}

loadData();
</script>
