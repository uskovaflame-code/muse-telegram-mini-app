function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }
function safeDate(iso){ return new Date(iso + 'T12:00:00'); }
function formatLongDate(iso){ return safeDate(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}); }
function formatShortDate(iso){ if(!iso) return '—'; return safeDate(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
function displayMonthParts(){ const [y,m]=data.displayMonth.split('-').map(Number); return {year:y,month:m}; }
function inDisplayMonth(iso){ return iso && iso.startsWith(data.displayMonth); }
function countInDisplayMonth(arr){ return arr.filter(inDisplayMonth).length; }
function uniquePush(arr,val){ if(!arr.includes(val)) arr.push(val); }
function sortedExamples(){
  return [...(data.examples||[])].sort((a,b)=> safeDate(b.date)-safeDate(a.date));
}
function syncExamples(type, value, date = data.today){
  data.examples = data.examples || [];
  data.examples = data.examples.filter(x => !(x.type===type && x.date===date));
  data.examples.unshift({date, type, value});
  data.examples = data.examples
    .sort((a,b)=> safeDate(b.date)-safeDate(a.date))
    .slice(0,10);
}
function storageKey(){
  const userId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
  return 'muse-journal-v1-' + (userId || 'browser');
}
function persistData(){
  try{ localStorage.setItem(storageKey(), JSON.stringify(data)); }catch(e){}
}
function dateInRange(date, start, end){
  if(!date || !start) return false;
  return date >= start && (!end || date <= end);
}
function recalcEstroBottleCount(){
  const start = data.estrogel.bottleStarted;
  if(!start) return;
  let total = 0;
  Object.entries(data.estrogel.daily || {}).forEach(([date, count]) => {
    if(date >= start) total += Number(count) || 0;
  });
  data.estrogel.bottlePressCount = total;
  const currentBottle = (data.estrogel.bottleHistory || []).find(item => item.current);
  if(currentBottle) currentBottle.totalPresses = total;
}
function estroCountBefore(date){
  const start = data.estrogel.bottleStarted;
  if(!start || date < start) return 0;
  let total = 0;
  Object.entries(data.estrogel.daily || {}).forEach(([d, count]) => {
    if(d >= start && d < date) total += Number(count) || 0;
  });
  return total;
}
function estroCountThrough(date){
  return estroCountBefore(date) + Number(data.estrogel.daily?.[date] || 0);
}
function localTodayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function removeExample(type, date){
  data.examples = (data.examples || []).filter(x => !(x.type === type && x.date === date));
}
function removeAction(kind, date){
  if(kind === 'estro'){
    if(data.estrogel.daily) delete data.estrogel.daily[date];
    if(date === data.today) data.estrogel.todayPresses = 0;
    removeExample('Эстрожель', date);
    recalcEstroBottleCount();
  }
  if(kind === 'utro'){
    data.utrogestan.takenDates = (data.utrogestan.takenDates || []).filter(d => d !== date);
    removeExample('Утрожестан', date);
  }
  if(kind === 'rsleek'){
    data.massages.rsleek = (data.massages.rsleek || []).filter(d => d !== date);
    removeExample('R-Sleek', date);
  }
  if(kind === 'lymph'){
    data.massages.lymph = (data.massages.lymph || []).filter(d => d !== date);
    removeExample('Лимфодренажный массаж', date);
  }
  if(kind === 'period'){
    data.cycle.periodDays = (data.cycle.periodDays || []).filter(d => d !== date);
    removeExample('Месячные', date);
    recalcCycleFromPeriods();
  }
  persistData();
  render();
}

function targetDate(){ return selectedDate || data.today; }
function targetLabel(){ return targetDate() === data.today ? 'сегодня' : formatLongDate(targetDate()); }
function shiftMonth(delta){
  const {year,month} = displayMonthParts();
  const d = new Date(year, month - 1 + delta, 1);
  data.displayMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const todayMonth = data.today.slice(0,7);
  selectedDate = data.displayMonth === todayMonth ? data.today : `${data.displayMonth}-01`;
  persistData();
  render();
}
function recalcCycleFromPeriods(){
  const today = safeDate(data.today);
  const actual = [...(data.cycle.periodDays || [])]
    .filter(d => safeDate(d) <= today)
    .sort();
  if(!actual.length) return;
  const starts=[];
  for(let i=0;i<actual.length;i++){
    if(i===0){ starts.push(actual[i]); continue; }
    const prev = safeDate(actual[i-1]);
    const cur = safeDate(actual[i]);
    const diff = Math.round((cur-prev)/86400000);
    if(diff>1) starts.push(actual[i]);
  }
  const latestStart = starts[starts.length-1];
  const diff = Math.floor((today-safeDate(latestStart))/86400000);
  if(diff >= 0) data.cycle.currentDay = diff + 1;
  const avg = Number(cycleAvg()) || 28;
  const next = new Date(safeDate(latestStart));
  next.setDate(next.getDate()+avg);
  data.cycle.nextPeriodEstimate = `${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-${String(next.getDate()).padStart(2,'0')}`;
}
function nextPeriodCaption(){
  if(!data.cycle.nextPeriodEstimate) return 'Следующая дата цикла не указана';
  return 'Ориентировочно: ' + formatLongDate(data.cycle.nextPeriodEstimate);
}
function cycleAvg(){
  const arr = data.cycle.previousCycles || [];
  if(!arr.length) return data.cycle.avgLength || '—';
  return Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
}
function estroAvgMonth(){
  const values = Object.entries(data.estrogel.daily || {}).filter(([date])=> inDisplayMonth(date)).map(([,n])=> Number(n)||0);
  if(!values.length) return 0;
  return (values.reduce((a,b)=>a+b,0) / values.length).toFixed(1);
}
function utroMonthTaken(){ return countInDisplayMonth(data.utrogestan.takenDates || []); }
function utroCourseProgress(){
  if(!data.utrogestan.startDay || !data.utrogestan.courseLengthDays) return {done:utroMonthTaken(),total:0};
  const total = data.utrogestan.courseLengthDays || 14;
  const start = data.utrogestan.startDay || 11;
  const month = displayMonthParts().month;
  const year = displayMonthParts().year;
  let done = 0;
  for(let i=0;i<total;i++){
    const day = start + i;
    const iso = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    if((data.utrogestan.takenDates || []).includes(iso)) done++;
  }
  return {done,total};
}
function isUtroScheduled(iso){
  if(!data.utrogestan.startDay || !data.utrogestan.courseLengthDays) return false;
  const d = safeDate(iso);
  const monthMatch = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` === data.displayMonth;
  if(!monthMatch) return false;
  const day = d.getDate();
  const start = data.utrogestan.startDay || 11;
  const end = start + (data.utrogestan.courseLengthDays || 14) - 1;
  return day >= start && day <= end;
}
function hasPeriod(iso){ return (data.cycle.periodDays || []).includes(iso); }
function marksFor(iso){
  const result=[];
  if(hasPeriod(iso)) result.push({key:'period',label:'Месячные',value:'отмечен день цикла'});
  if(data.estrogel.daily && data.estrogel.daily[iso]) result.push({key:'estro',label:'Эстрожель',value:`${data.estrogel.daily[iso]} нажатия`});
  if((data.utrogestan.takenDates || []).includes(iso)) result.push({key:'utro',label:'Утрожестан',value:'приём подтверждён'});
  if((data.massages.rsleek || []).includes(iso)) result.push({key:'rsleek',label:'R-Sleek',value:'процедура'});
  if((data.massages.lymph || []).includes(iso)) result.push({key:'lymph',label:'Лимфодренажный',value:'массаж'});
  return result;
}

function calendarGridHTML(showOutside = true){
  const {year,month} = displayMonthParts();
  const first = new Date(year, month - 1, 1);
  const daysInMonth = new Date(year, month, 0).getDate();
  const firstDay = (first.getDay() + 6) % 7;
  const prevMonthDays = new Date(year, month - 1, 0).getDate();
  let cells = [];

  if(showOutside){
    for(let i=0;i<firstDay;i++){
      const dayNum = prevMonthDays - firstDay + i + 1;
      cells.push(`<div class="day outside"><span class="day-num">${dayNum}</span></div>`);
    }
  } else {
    for(let i=0;i<firstDay;i++) cells.push('<div class="day outside"></div>');
  }

  for(let day=1; day<=daysInMonth; day++){
    const iso = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const marks = marksFor(iso);
    const classes = ['day'];
    if(iso === data.today) classes.push('today');
    if(selectedDate === iso) classes.push('selected');
    if(isUtroScheduled(iso)) classes.push('course');
    cells.push(`
      <button class="${classes.join(' ')}" data-date="${iso}">
        <span class="day-num">${day}</span>
        <span class="marks">${marks.slice(0,4).map(mark => `<i class="mark ${mark.key}"></i>`).join('')}</span>
      </button>
    `);
  }

  while(cells.length % 7 !== 0){
    const extraDay = cells.length - (firstDay + daysInMonth) + 1;
    cells.push(showOutside ? `<div class="day outside"><span class="day-num">${extraDay}</span></div>` : '<div class="day outside"></div>');
  }

  return `
    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div class="days">${cells.join('')}</div>`;
}

function openPanel(type){
  document.getElementById('sheetHome').style.display = 'none';
  const panel = document.getElementById('sheetPanel');
  panel.className = 'sheet-panel open';

  if(type === 'estro'){
    const date = targetDate();
    const before = estroCountBefore(date);
    let count = estroCountThrough(date);
    panel.innerHTML = `
      <h2>Эстрожель</h2>
      <div class="sheet-sub">Счётчик продолжается с предыдущего дня. Нажимай «+» за каждое новое нажатие ${targetLabel()}.</div>

        ${backButtonHTML()}
      </div>`;
    panel.querySelector('#minusBtn').onclick = () => {
      count = Math.max(before, count - 1);
      panel.querySelector('#countValue').textContent = count;
    };
    panel.querySelector('#plusBtn').onclick = () => {
      count += 1;
      panel.querySelector('#countValue').textContent = count;
    };

      const addedToday = Math.max(0, count - before);
      data.estrogel.daily[date] = addedToday;
      if(date === data.today) data.estrogel.todayPresses = addedToday;
      recalcEstroBottleCount();
      syncExamples('Эстрожель', `${addedToday} нажатия · счётчик ${count}`, date);
      persistData();
      actionDone();
    };
  }

  if(type === 'newBottle'){
    panel.innerHTML = `
      <h2>Новая бутылка</h2>

    panel.querySelector('#saveBottle').onclick = () => {
      data.estrogel.bottleHistory = data.estrogel.bottleHistory || [];
      const previousCurrent = data.estrogel.bottleHistory.find(item => item.current);
      if(previousCurrent) previousCurrent.totalPresses = data.estrogel.bottlePressCount;
      data.estrogel.bottleHistory.forEach(item => item.current = false);
      const date = targetDate();
      data.estrogel.bottleStarted = date;
      data.estrogel.bottlePressCount = 0;
      if(data.estrogel.daily) delete data.estrogel.daily[date];
      if(date === data.today) data.estrogel.todayPresses = 0;
      data.estrogel.bottleHistory.unshift({started:date,totalPresses:0,current:true});
      recalcEstroBottleCount();
      syncExamples('Новая бутылка', 'счётчик начат заново', date);

function deepMerge(base, saved){
  if(Array.isArray(base) || Array.isArray(saved)) return saved !== undefined ? saved : base;
  if(base && typeof base === 'object' && saved && typeof saved === 'object'){
    const out = {...base};
    Object.keys(saved).forEach(k => { out[k] = k in base ? deepMerge(base[k], saved[k]) : saved[k]; });
    return out;
  }
  return saved !== undefined ? saved : base;
}

async function loadData(){
  try{
    if(window.Telegram?.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
    const response = await fetch('data.json?v=' + Date.now(), {cache:'no-store'});
    if(!response.ok) throw new Error('bad fetch');
    data = await response.json();
  } catch(err){
    data = deepClone(fallbackData);
  }
  if(!data || typeof data !== 'object') data = deepClone(fallbackData);
  try{
    const saved = JSON.parse(localStorage.getItem(storageKey()) || localStorage.getItem('museDataV2') || 'null');
    if(saved) data = deepMerge(data, saved);
  }catch(e){}
  data.today = localTodayISO();
  data.displayMonth = data.today.slice(0,7);
  data.estrogel.todayPresses = Number(data.estrogel.daily?.[data.today] || 0);
  recalcCycleFromPeriods();
  recalcEstroBottleCount();
  if(!selectedDate) selectedDate = data.today;
  bindSheetEvents();
  render();
}

// Recompute bottle totals for each date range, including corrections in past bottles.
recalcEstroBottleCount=function(){
 const e=data.estrogel, entries=Object.entries(e.daily||{}), history=e.bottleHistory||[];
 const starts=[...new Set([...history.map(b=>b.started),e.bottleStarted].filter(Boolean))].sort();
 history.forEach(b=>{const end=starts.find(s=>s>b.started);b.totalPresses=entries.filter(([d])=>d>=b.started&&(!end||d<end)).reduce((a,[,n])=>a+(Number(n)||0),0)});
 e.bottlePressCount=entries.filter(([d])=>!e.bottleStarted||d>=e.bottleStarted).reduce((a,[,n])=>a+(Number(n)||0),0);
};
estroCountBefore=function(date){const starts=[...(data.estrogel.bottleHistory||[]).map(b=>b.started),data.estrogel.bottleStarted].filter(s=>s&&s<=date).sort();const start=starts.at(-1);return Object.entries(data.estrogel.daily||{}).filter(([d])=>d<date&&(!start||d>=start)).reduce((a,[,n])=>a+(Number(n)||0),0)};
const baseCycleRecalc=recalcCycleFromPeriods;
recalcCycleFromPeriods=function(){if(!(data.cycle.periodDays||[]).some(d=>d<=data.today)){data.cycle.currentDay='—';data.cycle.nextPeriodEstimate=null;return}baseCycleRecalc()};

if(batchMode)document.querySelectorAll('.day[data-date]').forEach(b=>b.onclick=()=>{const date=b.dataset.date;if(batchDates.has(date))batchDates.delete(date);else batchDates.add(date);render()});
const bt=document.getElementById('batchType');if(bt)bt.onchange=()=>batchType=bt.value;
const f=document.getElementById('rangeFrom'),t=document.getElementById('rangeTo');if(f)f.onchange=()=>rangeFrom=f.value;if(t)t.onchange=()=>rangeTo=t.value;
document.querySelectorAll('[data-select-range]').forEach(b=>b.onclick=()=>{rangeFrom=f.value;rangeTo=t.value;try{selectBatchRange(rangeFrom,rangeTo);render()}catch(e){document.getElementById('rangeError').textContent=e.message}});
document.querySelectorAll('[data-bulk-add]').forEach(b=>b.onclick=()=>{batchType=bt.value;applyBatch(batchType,false)});document.querySelectorAll('[data-bulk-remove]').forEach(b=>b.onclick=()=>{batchType=bt.value;applyBatch(batchType,true)});
document.querySelectorAll('.calendar-card').forEach(card=>{let start=null;card.addEventListener('touchstart',e=>{if(e.touches.length!==1){start=null;return}start={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});card.addEventListener('touchend',e=>{if(!start||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;start=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.6)shiftMonth(dx<0?1:-1)},{passive:true});card.addEventListener('touchcancel',()=>start=null,{passive:true})});
};
document.body.insertAdjacentHTML('beforeend','<div id="saveToast" class="toast" role="status" hidden><span class="toast-message"></span><button class="toast-undo" type="button">Отменить</button><button class="toast-close" aria-label="Скрыть уведомление">×</button></div>');document.getElementById('saveToast').querySelector('.toast-undo').onclick=undoLastChange;document.getElementById('saveToast').querySelector('.toast-close').onclick=dismissToast;
const productiveCloseSheet=closeSheet;closeSheet=function(){productiveCloseSheet();pendingMutationLabel='Сохранено'};
const copyLabel=(n,forms)=>{const v=Math.abs(n)%100;return v>=11&&v<=14?forms[2]:v%10===1?forms[0]:v%10>=2&&v%10<=4?forms[1]:forms[2]};
const todayWithCounts=todayPanelHTML;todayPanelHTML=function(){return todayWithCounts().replace(/(\d+) <small>нажатий<\/small>/g,(_,n)=>n+' <small>'+copyLabel(Number(n),['нажатие','нажатия','нажатий'])+'</small>')};
exportBackup=function(){
 const text=JSON.stringify(backupPayload(),null,2),url=URL.createObjectURL(new Blob([text],{type:'application/json'})),name='MUSE-backup-'+localTodayISO()+'.json';
 openSheet();document.getElementById('sheetHome').style.display='none';const panel=document.getElementById('sheetPanel');panel.className='sheet-panel open';
 panel.innerHTML='<div class="panel-symbol">'+icon('profile')+'</div><h2>Резервная копия</h2><div class="sheet-sub">В копии — твои отметки, история бутылок и личные настройки. Файл остаётся у тебя.</div><div class="backup-details">Отметок: '+backupEntryCount(data)+'<br>Бутылок: '+data.estrogel.bottleHistory.length+'</div><div class="sheet-actions"><a class="btn-primary backup-download" id="downloadBackupLink" style="display:block;text-align:center;text-decoration:none" download="'+name+'" href="'+url+'">Скачать JSON-файл</a><button class="btn-secondary" id="copyBackupText">Скопировать копию</button></div><p class="form-note" style="margin-top:14px">Если скачивание недоступно, скопируй JSON и сохрани его в текстовый файл с расширением .json.</p><details style="margin-top:15px"><summary style="font-size:11px;color:#8c7b68">Показать содержимое копии</summary><textarea id="backupText" readonly aria-label="JSON резервной копии" style="width:100%;height:160px;margin-top:12px;font:10px monospace;border:1px solid #ded1bf;border-radius:10px;padding:10px;background:#fffaf4"></textarea></details><div id="exportStatus" class="import-status" role="status"></div><button class="btn-secondary" id="closeBackupExport" style="width:100%">Готово</button>';
 panel.querySelector('#backupText').value=text;panel.querySelector('#closeBackupExport').onclick=()=>{URL.revokeObjectURL(url);closeSheet()};
 panel.querySelector('#downloadBackupLink').onclick=()=>panel.querySelector('#exportStatus').textContent='Файл подготовлен. Если скачивание не началось, используй копирование ниже.';
 panel.querySelector('#copyBackupText').onclick=async()=>{try{await navigator.clipboard.writeText(text);panel.querySelector('#exportStatus').textContent='Копия скопирована. Сохрани её в файл .json.'}catch(e){const area=panel.querySelector('#backupText');area.parentElement.open=true;area.focus();area.select();panel.querySelector('#exportStatus').textContent='Текст выделен. Скопируй его через меню устройства.'}};
 setTimeout(()=>URL.revokeObjectURL(url),600000);
};
const restoreWithExport=openRestore;openRestore=function(){restoreWithExport();const panel=document.getElementById('sheetPanel'),button=panel.querySelector('#exportBeforeRestore');if(button){const url=URL.createObjectURL(new Blob([JSON.stringify(backupPayload(),null,2)],{type:'application/json'}));button.outerHTML='<a id="exportBeforeRestore" class="btn-secondary" style="text-align:center;text-decoration:none" href="'+url+'" download="MUSE-backup-'+localTodayISO()+'.json">Скачать текущие данные</a>';setTimeout(()=>URL.revokeObjectURL(url),600000)}};


const todayBeforeVisualFix=todayViewHTML;
todayViewHTML=function(){let position=0;return todayBeforeVisualFix().replace(/<div class="product-stage">[\s\S]*?<\/div>/g,()=>{const gel=position++===0;return '<div class="product-stage ritual-visual '+(gel?'gel-visual':'capsule-visual')+'"><span class="mini-tag">'+(gel?'Учёт нажатий':'Учёт приёма')+'</span><div class="ritual-illustration">'+icon(gel?'bottle':'capsule')+'</div><span class="visual-caption">'+(gel?'ТВОЯ ТЕКУЩАЯ БУТЫЛКА':'ТВОЙ ЛИЧНЫЙ ГРАФИК')+'</span></div>'})};


const illustratedCardsBefore=todayViewHTML;
todayViewHTML=function(){let card=0;return illustratedCardsBefore().replace(/<div class="product-stage ritual-visual (?:gel-visual|capsule-visual)">[\s\S]*?<\/div><span class="visual-caption">[\s\S]*?<\/span><\/div>/g,()=>{const gelCard=card++===0;return '<div class="product-stage ritual-visual illustrated '+(gelCard?'gel-visual':'capsule-visual')+'"><img src="'+(gelCard?"muse-art-4a08f442a71d.png":"muse-art-380ed778bc76.png")+'" alt="'+(gelCard?'Акварельная иллюстрация шалфейного флакона с дозатором':'Акварельная иллюстрация перламутровых капсул на розовом блюдце')+'" loading="lazy" decoding="async"><span class="mini-tag">'+(gelCard?'Учёт нажатий':'Учёт приёма')+'</span></div>'})};


function massageCalendarIcon(kind){return '<span class="calendar-massage '+kind+'" aria-hidden="true"><svg viewBox="0 0 16 16">'+(kind==='rsleek'?'<path d="M2 4c2-3 4 3 6 0s4 3 6 0M2 8c2-3 4 3 6 0s4 3 6 0M2 12c2-3 4 3 6 0s4 3 6 0"/>':'<path d="M8 1.5S3.5 7 3.5 10a4.5 4.5 0 0 0 9 0C12.5 7 8 1.5 8 1.5Z"/><path d="M6 10a2 2 0 0 0 2 2"/>')+'</svg></span>'}
const beforeReadableToday=todayViewHTML;
todayViewHTML=function(){const day=data.cycle.currentDay,known=Number.isFinite(Number(day))&&Number(day)>0;const summary='<section class="cycle-highlight"><div><span class="cycle-label">Твой цикл сегодня</span><strong'+(!known?' class="cycle-empty"':'')+'>'+(known?day+'<small>день цикла</small>':'Отметь начало цикла')+'</strong><p>'+(known?nextPeriodCaption():'После первой отметки здесь будет день цикла')+'</p></div><button class="icon-btn" data-today-action="period" aria-label="Добавить день цикла">'+icon('bloom')+'</button></section>';
return beforeReadableToday().replace('<section class="hero">',summary+'<section class="hero">').replace(known?day+' день цикла · ':'Начни с первой отметки цикла.',known?'':'Твой личный ритм заботы.').replace(/<div class="care-bottom"><b>(\d+) (нажатий|отметок за месяц)<\/b>/g,(_,n,unit)=>'<div class="care-bottom"><b><span class="ritual-count-number">'+n+'</span><span class="ritual-count-label">'+(unit==='нажатий'?copyLabel(Number(n),['нажатие','нажатия','нажатий']):copyLabel(Number(n),['отметка','отметки','отметок'])+' за месяц')+'</span></b>')};
const beforeReadableGrid=calendarGridHTML;
calendarGridHTML=function(outside=true){return beforeReadableGrid(outside).replace(/<i class="mark (rsleek|lymph)"><\/i>/g,(_,kind)=>massageCalendarIcon(kind)).replace(/data-date="([^"]+)" aria-label="([^"]+)"/g,(_,date,label)=>{const types=filteredMarks(date).filter(m=>m.key==='rsleek'||m.key==='lymph').map(m=>m.key==='rsleek'?'R-Sleek':'лимфодренажный массаж');return 'data-date="'+date+'" aria-label="'+label+(types.length?' · '+types.join(' · '):'')+'"'})};
const beforeReadableCalendar=calendarCardHTML;
calendarCardHTML=function(title=true){return beforeReadableCalendar(title).replace('legend-rsleek"><i></i>','legend-rsleek">'+massageCalendarIcon('rsleek')).replace('legend-lymph"><i></i>','legend-lymph">'+massageCalendarIcon('lymph'))+'<p class="calendar-massage-note">Волнистые линии — R-Sleek, капля — лимфодренажный массаж.</p>'};

loadData();
</script>
